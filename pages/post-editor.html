<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Make a Post</title><link rel="stylesheet" href="page.css"><link rel="stylesheet" href="brand-page.css"><script src="../assets/js/post-editor.js" defer></script></head><body><header class="page-header"><span class="big-icon">📝</span><div><h1>MAKE A CLASS POST</h1><p>No HTML knowledge required!</p></div></header><div class="grid-2"><form id="post-form" class="panel editor"><h2>POST-O-MATIC 2000</h2><label for="title">Post title</label><input id="title" name="title" required placeholder="Lab due Friday"><label for="className">Section</label><select id="className" name="className"><option>Astronomy</option><option>Physics</option><option>Chemistry</option><option>Robotics</option></select><label for="date">Date</label><input id="date" name="date" type="date" required><label for="author">Author</label><input id="author" name="author" value="Mr. Dixon"><label for="body">Post</label><textarea id="body" name="body" required placeholder="Write your announcement here..."></textarea><div class="actions"><button class="button" type="submit">DOWNLOAD POST FILE</button></div></form><section class="panel"><h2>LIVE PREVIEW</h2><div id="post-preview"></div><div class="notice"><b>How to publish:</b><br>1. Download the post.<br>2. Put it in <code>posts/[section]/</code>.<br>3. Add its filename to that folder's <code>index.json</code>.<br>4. Commit and push to GitHub.</div></section></div></body></html>
